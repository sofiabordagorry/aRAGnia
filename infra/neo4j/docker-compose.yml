services:
  neo4j:
    image: neo4j:5.22
    container_name: institutional-neo4j
    restart: unless-stopped

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes

      # Memoria
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX}

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
