services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-graphrag
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-graphrag
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  libreoffice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreoffice-converter
    command: tail -f /dev/null
    volumes:
      - ./shared:/data
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${POSTGRES_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-graphrag
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: >
      -c "
      until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 2; done;
      OLLAMA_HOST=http://ollama:11434 ollama pull llama3.2:3b;
      OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:3b-instruct;
      "
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
  ollama_data: