[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "institutional-graphrag"
version = "0.1.0"
description = "GraphRAG para proyectos institucionales"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "urllib3>=2.5.0",
    "docling>=2.0.0",
    "langchain-docling>=2.0.0",
    "langchain-core>=1.2.5",
    "langchain-text-splitters>=0.2.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "hf-xet>=1.0.0",
    "scikit-learn>=1.3.0",
    "qdrant-client>=1.7.0",
    "groq",
    "transformers",
    "huggingface_hub>=0.34,<1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "neo4j>=5.0",
    "psycopg2-binary>=2.9.6",
    "docker>=6.1",
    "ijson>=3.2.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black==26.1.0",
    "mypy>=1.5.0",
    "ruff==0.15.22",
    "types-requests",
    "pandas-stubs",  # <-- AGREGADO
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["odf", "odf.*", "ijson", "ijson.*", "tabula", "tabula.*"]
ignore_missing_imports = true