name: graphrag
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # PyTorch con soporte CUDA (el cluster elige la versión de CUDA disponible)
  - pytorch::pytorch>=2.0.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - pip:
      # Procesamiento de documentos
      - docling>=2.0.0
      - langchain-docling>=2.0.0
      - langchain-core>=1.2.5
      - langchain-text-splitters>=0.2.0
      - docling_core
      # Embeddings y búsqueda vectorial
      - sentence-transformers>=3.0.0
      - transformers
      - accelerate>=0.26.0
      - huggingface_hub>=0.34,<1.0
      - hf-xet>=1.0.0
      - bitsandbytes>=0.43.0
      # LLM
      - groq
      # Datos y procesamiento
      - numpy>=1.24.0
      - pandas>=2.0
      - scikit-learn>=1.3.0
      - pyarrow>=14.0
      - ijson>=3.2.3
      - openpyxl>=3.1
      - odfpy>=1.4
      - tabula-py>=2.9
      - matplotlib>=3.7
      # Utilidades
      - python-dotenv>=1.0.0
      - requests>=2.32.0
      - urllib3>=2.5.0
