<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GraphRAG Chat</title>
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/topbar.css" />
    <link rel="stylesheet" href="/css/pdf-modal.css" />
  </head>
  <body data-page="index">
    <div id="topbar"></div>

    <main class="app">
      <section class="chat-page">
        <div class="layout">
          <section class="left">
            <div class="field">
              <label for="queryInput">Consulta</label>
              <div class="input-row">
                <input
                  id="queryInput"
                  class="query-input"
                  placeholder="Escribí tu pregunta..."
                />
                <button id="askBtn" class="ask-btn" type="button">
                  Preguntar
                </button>
              </div>
              <div class="subhint">Enter para enviar.</div>
            </div>

            <div class="chat-shell">
              <div id="chat" class="chat"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="pdfModal" class="pdf-modal hidden">
      <div class="pdf-modal-box">
        <div class="pdf-modal-head">
          <div>
            <strong id="pdfModalTitle">PDF</strong>
            <div id="pdfModalSubtitle" class="pdf-modal-subtitle"></div>
          </div>

          <button id="pdfModalClose" class="pdf-modal-close">Cerrar</button>
        </div>

        <div id="pdfViewer" class="pdf-viewer"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="/js/pdf-modal.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/topbar.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
