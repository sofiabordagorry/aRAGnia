<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RAG / GraphRAG Chat</title>
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/topbar.css" />
  </head>
  <body data-page="index">
    <div id="topbar"></div>

    <main class="app">
      <section class="chat-page">
        <div class="layout">
          <section class="left">
            <div class="field">
              <label for="queryInput">Consulta</label>
              <div class="input-row">
                <input
                  id="queryInput"
                  class="query-input"
                  placeholder="Escribí tu pregunta..."
                />
                <button id="askBtn" class="ask-btn" type="button">
                  Preguntar
                </button>
              </div>
              <div class="subhint">Enter para enviar.</div>
            </div>

            <div class="chat-shell">
              <div id="chat" class="chat"></div>
              <span id="modeBadge" class="badge mode-badge">Modo: RAG</span>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/topbar.js"></script>
    <script src="/js/çhat.js"></script>
  </body>
</html>
