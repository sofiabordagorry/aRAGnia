 <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Historial - RAG / GraphRAG</title>
    <link rel="stylesheet" href="/css/history.css" /> 
    <link rel="stylesheet" href="/css/styles.css" /> 
  </head>
  <body>
    <div id="topbar"></div>
    <div class="app">
      <div class="history-page">

        <!-- CABECERA -->
        <div class="history-top">
          <div class="history-title">Historial</div>
          <div class="history-sub">Preguntas guardadas en tu navegador (localStorage).</div>
        </div>

        <!-- BARRA DE HERRAMIENTAS + BOTONES INTEGRADOS -->
        <div class="history-tools">
          <div class="tools-bar">
            <input
              id="searchInput"
              class="query-input"
              placeholder="Buscar en el historial..."
            />
            <div class="history-filters">
              <button id="filterAll" class="seg-btn active" type="button">Todo</button>
              <button id="filterRag" class="seg-btn" type="button">RAG</button>
              <button id="filterGraph" class="seg-btn" type="button">GraphRAG</button>
            </div>
          </div>
          <button id="clearHistoryBtn" class="danger-btn" type="button">Borrar historial</button>
        </div>

        <!-- MENSAJE VACÍO -->
        <div id="historyEmpty" class="history-empty">
          Aún no hay preguntas en el historial.
        </div>

        <!-- LISTADO DE TARJETAS -->
        <div id="historyList" class="history-list-page" aria-label="Historial">
          <!-- items por JS -->
        </div>
      </div>
    </div>

    <script src="/js/history.js" defer></script>
    <script src="/js/layout.js"></script>
  </body>
</html>
