name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov black mypy ruff
          pip install -e . --no-deps

      - name: Lint with ruff
        working-directory: backend
        run: |
          ruff check src tests

      - name: Check formatting with black
        working-directory: backend
        run: |
          black --check src tests

      - name: Type check with mypy
        working-directory: backend
        run: |
          mypy src/institutional_graphrag

      - name: Run tests
        working-directory: backend
        run: |
          pytest -v --ignore=tests/test_load_pdf.py --ignore=tests/test_docling_parse.py

      - name: Frontend - Install deps
        working-directory: frontend
        run: |
          npm ci

      - name: Frontend - Format check
        working-directory: frontend
        run: |
          npx prettier --check "public/**/*.html" "css/**/*.css" "js/**/*.js"
